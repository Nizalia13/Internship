[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-envelopes"
version = "0.2.0"
description = "Class-specific conformal envelopes with missing-score handling."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]
examples = ["scikit-learn", "ipykernel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["conformal_envelopes*"]
namespaces = false